<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foto da Equipe</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f3f3f3;
        text-align: center;
        padding: 20px;
    }
    #wrap {
        position: relative;
        display: inline-block;
        max-width: 420px;
        width: 100%;
    }
    video, canvas {
        width: 100%;
        border-radius: 12px;
        height: 100%;
        display: block; /* Remove o espaço branco embaixo do vídeo */
    }
    /* Estilo para posicionar a imagem da moldura exatamente sobre o vídeo */
    #moldura {
        position: absolute;
        inset: 0; /* Cola em cima, baixo, esquerda e direita */
        width: 100%;
        height: 100%;
        pointer-events: none; /* Permite clicar através da imagem se necessário */
        border-radius: 12px;
        z-index: 10;
    }
    button {
        padding: 12px 20px;
        margin: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    video, canvas {
        width: 100%;
        border-radius: 12px;
        height: 100%;
        display: block;
    }
    
    video {
        transform: scaleX(-1); /* Isso cria o efeito de espelho no vídeo */
    }

</style>
</head>
<body>
<h2>Foto Oficial da Equipe</h2>

<div id="wrap">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none"></canvas>

    <img id="moldura" src="./moldura.png" alt="Moldura da Equipe">
</div>

<div>
    <button onclick="capture()">📸 Tirar Foto</button>
    <a id="download" style="display:flex"><button>⬇️ Baixar</button></a>
</div>

<script>
    const video = document.getElementById('video');

    navigator.mediaDevices.getUserMedia({video: true})
        .then(stream => video.srcObject = stream)
        .catch(err => console.error("Erro ao acessar a câmera:", err));

    function capture() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const moldura = document.getElementById('moldura');

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // Desenha a câmera primeiro
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Desenha a moldura por cima
        ctx.drawImage(moldura, 0, 0, canvas.width, canvas.height);

        try {
            // Tenta gerar a imagem final
            const dataUrl = canvas.toDataURL('image/png');
            
            // Força o download automático
            const link = document.getElementById('download');
            link.href = dataUrl;
            link.download = 'foto-equipe.png';
            link.click(); 

        } catch (error) {
            // Se cair aqui, é porque você está usando um arquivo local (file://) sem Base64 ou sem Servidor
            console.error("Erro no Canvas:", error);
            alert("Erro de segurança do navegador! Para baixar a foto, você precisa usar um código Base64 na imagem da moldura ou rodar este arquivo através de um servidor local (como o Live Server do VS Code).");
        }
    }
</script>
</body>
</html>
